# ======================================================================
# MIS FINANZAS - CONTROLES AUTOMÁTICOS
# ======================================================================
# Cuándo corre : en cada pull request y en cada cambio que llega a main.
# Qué hace     : 1) revisa la sintaxis de api/, 2) compila la app,
#                3) corre las pruebas de lógica (vencimientos y avisos),
#                4) corre las pruebas del servidor sobre PostgreSQL de prueba,
#                5) corre las pruebas de pantallas en un trabajo informativo
#                   (hoy 8 de 16 escenarios fallan en GitHub; se revisan antes
#                   de volverlo obligatorio).
# Seguridad    : - No usa claves ni secretos. No toca Neon ni Vercel.
#                - Permisos mínimos: solo lectura del repositorio.
#                - Las acciones externas están fijadas a un commit exacto.
#                - No usa pull_request_target, así que un pull request de un
#                  fork no recibe permisos de escritura.
# ======================================================================
name: Controles

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Sintaxis, compilación y lógica
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias (sin scripts de instalación)
        run: npm ci --ignore-scripts
      - name: Revisar sintaxis de api/
        run: npm run check:api
      - name: Compilar la app
        run: npm run build
      - name: Pruebas de lógica
        run: npm run test:logica

  servidor:
    name: Servidor sobre PostgreSQL de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias (sin scripts de instalación)
        run: npm ci --ignore-scripts
      - name: Instalar PostgreSQL de prueba (solo en esta carpeta, versión fija)
        run: bash scripts/ci-correr.sh "Instalar herramientas de prueba" npm install --no-save --package-lock=false --ignore-scripts --prefix verificacion @electric-sql/pglite@0.5.10
      - name: Pruebas del servidor
        run: bash scripts/ci-correr.sh "Pruebas del servidor" node --experimental-vm-modules verificacion/pruebas/api-postgres.mjs .

  pantallas:
    name: Pantallas (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informativo: hoy fallan 8 de 16 escenarios en GitHub. Se revisa y,
    # cuando pase completo, se quita esta línea para que también bloquee.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias (sin scripts de instalación)
        run: npm ci --ignore-scripts
      - name: Instalar herramientas de prueba (solo en esta carpeta, versión fija)
        run: bash scripts/ci-correr.sh "Instalar herramientas de prueba" npm install --no-save --package-lock=false --ignore-scripts --prefix verificacion playwright@1.63.0
      - name: Instalar Chromium
        run: bash scripts/ci-correr.sh "Instalar Chromium" npx --prefix verificacion playwright install --with-deps chromium
      - name: Pruebas de pantallas
        env:
          AUDIT_PROJECT: .
        run: bash scripts/ci-correr.sh "Pruebas de pantallas" node verificacion/pruebas/navegador.cjs
